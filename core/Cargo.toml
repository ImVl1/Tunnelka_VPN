[package]
name = "tunnelka-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Subscriptions, share-link parser and sing-box config builder for Tunnelka"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "socks"] }
