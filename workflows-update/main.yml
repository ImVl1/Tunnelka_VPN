name: Site

# Сайт с кнопками загрузки (GitHub Pages). Ссылки на файлы берутся
# из последнего релиза при открытии страницы, поэтому пересобирать сайт
# после каждого релиза не нужно.
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/main.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp assets/icon.png site/icon.png
          cp -r assets/screenshots site/screenshots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
