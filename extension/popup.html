<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="24" height="24" />
    <div class="title">
      <b>Tunnelka</b>
      <span id="status" class="muted">Загрузка…</span>
    </div>
    <label class="switch" title="Направлять браузер через VPN">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <div class="seg" role="radiogroup">
    <button data-mode="app">Через приложение</button>
    <button data-mode="direct">Свой прокси</button>
  </div>

  <!-- режим приложения -->
  <section id="sec-app">
    <div class="app-line">
      <span id="app-state" class="muted"></span>
      <button id="app-toggle" class="btn"></button>
    </div>
    <select id="app-server" aria-label="Сервер"></select>
    <details id="pair">
      <summary>Связь с приложением</summary>
      <label>Порт API <input id="app-port" type="number" min="1024" max="65535" /></label>
      <label>Токен <input id="app-token" placeholder="из Настроек приложения" /></label>
      <button id="pair-save" class="btn primary">Сохранить</button>
    </details>
  </section>

  <!-- свой прокси -->
  <section id="sec-direct" hidden>
    <div id="direct-list" class="list"></div>
    <textarea id="direct-input" rows="2" placeholder="socks5://user:pass@host:1080&#10;http://host:3128"></textarea>
    <button id="direct-add" class="btn">Добавить прокси</button>
    <p class="hint">Браузер умеет только HTTP, HTTPS и SOCKS. Для VLESS, VMess, Trojan, Hysteria2 используйте режим «Через приложение». Chrome не поддерживает логин и пароль для SOCKS5.</p>
  </section>

  <section>
    <h3>Какие сайты через VPN</h3>
    <select id="route-type">
      <option value="all">Все сайты</option>
      <option value="include">Только сайты из списка</option>
      <option value="exclude">Все, кроме сайтов из списка</option>
    </select>
    <div id="route-box">
      <textarea id="domains" rows="5" placeholder="youtube.com&#10;instagram.com"></textarea>
      <div class="row">
        <button id="add-current" class="btn">Добавить текущий сайт</button>
        <button id="domains-save" class="btn primary">Сохранить список</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="webrtc" /> Защита от утечки IP через WebRTC</label>
  </section>

  <p id="error" class="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
