name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "README.md", ".github/workflows/main.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tunnelka-core

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npm run fetch-core
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tunnelka-windows
          path: target/release/bundle/nsis/*.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npm run fetch-android
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            # Без секрета APK подписывается временным ключом: устанавливается,
            # но обновить его поверх прошлой версии не получится.
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias tunnelka -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass temporary -keypass temporary -dname "CN=Tunnelka"
            echo "ANDROID_KEYSTORE_PASSWORD=temporary" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=tunnelka" >> "$GITHUB_ENV"
      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run build-android
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n1)" \
            "dist/Tunnelka_${VERSION}_android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tunnelka-android
          path: dist/*.apk

  release:
    # Каждое обновление ветки main публикует релиз с номером версии из tauri.conf.json.
    # Если версия не менялась, файлы в релизе заменяются новыми.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - id: v
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Tunnelka ${{ steps.v.outputs.version }}
          make_latest: true
          files: out/*
