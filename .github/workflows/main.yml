name: Site

# После публикации релиза обновляем Pages. Правки самого сайта можно
# публиковать отдельно, не ожидая сборки установщиков.
on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "assets/**", ".github/workflows/main.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  upload:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          cp assets/icon.png site/icon.png
          cp -r assets/screenshots site/screenshots
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site
      - name: Проверить загрузку артефакта Pages
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
