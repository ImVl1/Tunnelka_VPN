[package]
name = "tauri-plugin-tunnelka-vpn"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Android VpnService для Tunnelka"
links = "tauri-plugin-tunnelka-vpn"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
